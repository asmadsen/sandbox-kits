# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: OpenCode + OpenChamber
description: >-
  OpenCode with the OpenChamber server running on loopback. Designed to be
  driven by the OpenChamber desktop app through an SSH Remote Instance.

args:
  nodeVersion:
    default: "24.22.1"
    pattern: '^24\.[0-9]+\.[0-9]+$'
    buildArg: NODE_VERSION
    description: Node.js version installed for OpenChamber
  opencodeVersion:
    default: "2.1.3"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: OPENCODE_VERSION
    description: OpenCode CLI version
  openchamberVersion:
    default: "2.5.1"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: OPENCHAMBER_VERSION
    description: OpenChamber version

provides:
  - "opencode@${{ kit.args.opencodeVersion }}"
  - "openchamber@${{ kit.args.openchamberVersion }}"

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # OpenCode model catalog, auth, and plugins.
          - opencode.ai
          - models.dev
          - api.openchamber.dev
          - "*.opencode.ai"
          - registry.npmjs.org
          # Language-server and release downloads.
          - github.com
          - api.github.com
          - raw.githubusercontent.com
          - objects.githubusercontent.com

  # The server must outlive the terminal session that started the sandbox.
  - type: com.docker.sandbox/long-running@1
